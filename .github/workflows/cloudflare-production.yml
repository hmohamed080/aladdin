# Aladdin - Cloudflare PRODUCTION Workers (ADR-0021, ADR-0022), Phase D of the release plan.
#
# Manual only, from `main` only, one stage per run. Deploys the `production` environments. Their public
# hostnames (Custom Domains aladdindecore.com and www on the frontend, since the 2026-10-27 cutover) are managed
# in the Cloudflare dashboard, not here; the Workers declare no route and no workers.dev. It never touches DNS.
#
#   stage = check     builds and bundles both Workers (dry run). Uploads nothing. The default.
#   stage = backend   deploys `aladdin-backend-production` (FastAPI in a Container). Run first.
#   stage = frontend-upload  UPLOAD-ONLY: builds and uploads the frontend as a NEW VERSION that is NOT deployed (serves 0% of traffic;
#                     users are unaffected). Test it on the live hostname with the request header
#                       Cloudflare-Workers-Version-Overrides: aladdin-frontend-production="<version id>"
#                     (only requests that carry it reach the new version), then promote it by hand with
#                       wrangler versions deploy <version id>@100% --env production
#                     which is the user-facing activation and needs its own approval. Never promotes by itself.
#   stage = frontend  deploys `aladdin-frontend-production`. Refuses to run unless the backend Worker already
#                     exists, because the frontend's BACKEND service binding points at it. It also refuses unless the WhatsApp OTP
#                     Worker exists (the OTP_WORKER service binding). Goes live immediately: prefer frontend-upload first.
#
# MEDIA MODE (input `media_mode`, frontend stages only). The committed config is the FUTURE R2-only cutover state and is never edited to
# ship an unrelated release; the mode decides what a release carries, as `--var` overrides on the wrangler command line:
#   legacy-hold  (default) R2_STORAGE_ENABLED=false, R2_PRODUCTION_WRITES_APPROVED=false, MEDIA_LEGACY_STORAGE_WRITES=true: the same
#                media behaviour as the Worker that is live, so a release of UI/registration changes moves no media write path.
#   r2-only      no overrides: the committed R2-only flags. This is the cutover; promoting such a version needs its own approval.
# Before anything is uploaded the "Release flags" step computes the effective flags and fails unless they are exactly the mode's promise,
# and prints them in the run summary. Every frontend wrangler command (dry run, upload, deploy) takes its overrides from the same script.
#
# R2-only media is ON in the committed config (R2_STORAGE_ENABLED / R2_PRODUCTION_WRITES_APPROVED true, legacy writes
# closed). A version uploaded by frontend-upload serves 0% of traffic, so nothing goes live; stage=frontend (immediate
# deploy) is refused unless the environment variable R2_CUTOVER_APPROVED is "true".
#
# SAFE BY DEFAULT: nothing is uploaded unless the GitHub Environment `cloudflare-production` has the variable
# CLOUDFLARE_PRODUCTION_ENABLED set to exactly "true". Without it every stage builds and bundles only.
# The environment must require the owner as reviewer and allow the `main` branch only.
#
# GitHub Environment `cloudflare-production`:
#   secrets:   CLOUDFLARE_API_TOKEN   (this account only: Workers Scripts:Edit plus Containers:Edit; no zone scope)
#   variables: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PRODUCTION_ENABLED,
#              NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (the LIVE project kkpkgjrweysgvhvkhzun),
#              NEXT_PUBLIC_TURNSTILE_SITE_KEY                          (the live `aladdin-production` widget)
# There are NO defaults: an unset value fails the run. Acceptance values are refused by
# frontend/scripts/check-cloudflare-production.mjs and by asking the live project to accept the anon key.
#
# Worker secrets: the backend's SUPABASE_URL and SUPABASE_ANON_KEY are the live project's public values and
# are uploaded with the backend version. The frontend's SUPABASE_SERVICE_ROLE_KEY, TURNSTILE_SECRET_KEY and
# AUTH_PASSWORD_PREVIEW_GRANT_SECRET are set by the owner with `wrangler secret put <NAME> --env production`
# (never in GitHub); `wrangler deploy` refuses the frontend until all three exist.
#
# Rollback: `wrangler rollback --env production` per Worker, or roll back to an earlier version in the
# dashboard (Deployments). Never `wrangler delete` the frontend: it serves the live site.

name: Cloudflare production

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "check = build and bundle only; backend first; frontend-upload = new version, no traffic; frontend = deploy and go live"
        type: choice
        options: [check, backend, frontend-upload, frontend]
        default: check
      media_mode:
        description: "Frontend stages: legacy-hold = R2 writes OFF and Supabase Storage writes kept (like the live Worker); r2-only = the committed R2 cutover flags"
        type: choice
        options: [legacy-hold, r2-only]
        default: legacy-hold

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: cloudflare-production (${{ inputs.stage }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      STAGE: ${{ inputs.stage }}
      MEDIA_MODE: ${{ inputs.media_mode }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      UPLOAD: ${{ vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true' && inputs.stage != 'check' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare account preflight (fail closed on a missing or different account)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/r2-account-preflight.mjs
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Production config and live values only
        env:
          # Set to "true" by the owner at the final cutover approval; until then stage=frontend (immediate deploy) is refused.
          R2_CUTOVER_APPROVED: ${{ vars.R2_CUTOVER_APPROVED }}
        run: |
          node frontend/scripts/check-cloudflare-production.mjs --live-values
          # The live project must accept the anon key (legacy JWT or sb_publishable_ alike).
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/settings")
          [ "$status" = "200" ] || { echo "The live project does not accept NEXT_PUBLIC_SUPABASE_ANON_KEY (HTTP $status)"; exit 1; }
          echo "Stage: $STAGE, upload: $UPLOAD" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release flags (effective media flags must be exactly the chosen mode, before anything is built or uploaded)
        if: inputs.stage != 'backend'
        run: node frontend/scripts/check-cloudflare-production.mjs --verify-media-mode "$MEDIA_MODE" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm install --frozen-lockfile

      # Backend: FastAPI image + Worker, no public address.
      - name: Backend tests
        if: inputs.stage != 'frontend'
        run: pnpm --dir edge/backend-worker test
      - name: Backend bundle (dry run, builds the image)
        if: inputs.stage != 'frontend'
        working-directory: edge/backend-worker
        run: pnpm exec wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/backend"
      - name: Deploy aladdin-backend-production
        if: inputs.stage == 'backend' && env.UPLOAD == 'true'
        working-directory: edge/backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          umask 077
          # Public values of the live project; written to a private temp file, never echoed.
          node -e 'process.stdout.write(JSON.stringify({ SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL, SUPABASE_ANON_KEY: process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY }))' > "$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          pnpm exec wrangler deploy --env production --secrets-file "$RUNNER_TEMP/secrets.json"
          pnpm exec wrangler secret list --env production --format json | jq -r '.[].name' | sort | tee -a "$GITHUB_STEP_SUMMARY"

      # Frontend: OpenNext build with the live public values, then the Worker, no public address.
      - name: Backend Worker must exist before the frontend
        if: (inputs.stage == 'frontend' || inputs.stage == 'frontend-upload') && env.UPLOAD == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/aladdin-backend-production/settings")
          [ "$status" = "200" ] || { echo "aladdin-backend-production is not deployed (HTTP $status): run stage=backend first"; exit 1; }
      - name: WhatsApp OTP Worker must exist before the frontend (service binding OTP_WORKER)
        if: (inputs.stage == 'frontend' || inputs.stage == 'frontend-upload') && env.UPLOAD == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/aladdin-whatsapp-otp-production/settings")
          [ "$status" = "200" ] || { echo "aladdin-whatsapp-otp-production is not deployed (HTTP $status): deploy the private OTP Worker (P-6) first"; exit 1; }
      - name: Build the frontend for Workers
        if: inputs.stage != 'backend'
        run: pnpm --filter frontend cf:build
      - name: Frontend bundle (dry run)
        if: inputs.stage != 'backend'
        working-directory: frontend
        run: |
          source ../frontend/scripts/production-media-vars.sh
          pnpm exec wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/frontend" "${MEDIA_VARS[@]}"
      - name: Upload aladdin-frontend-production as an UNDEPLOYED version (0% of traffic)
        if: inputs.stage == 'frontend-upload' && env.UPLOAD == 'true'
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          source ../frontend/scripts/production-media-vars.sh
          pnpm exec wrangler versions upload --env production --message "upload-only ${GITHUB_SHA::12} ($MEDIA_MODE)" \
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" \
            --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "${MEDIA_VARS[@]}" | tee "$RUNNER_TEMP/upload.txt"
          {
            echo "### Frontend version uploaded, NOT deployed (0% of traffic)"
            grep -i "version id" "$RUNNER_TEMP/upload.txt" || true
            echo "Test with the header Cloudflare-Workers-Version-Overrides: aladdin-frontend-production=\"<version id>\"; promote with wrangler versions deploy <version id>@100% --env production (separate approval)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy aladdin-frontend-production
        if: inputs.stage == 'frontend' && env.UPLOAD == 'true'
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Server code reads the public Supabase values at runtime too.
        run: |
          source ../frontend/scripts/production-media-vars.sh
          pnpm exec wrangler deploy --env production \
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" \
            --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "${MEDIA_VARS[@]}"
          pnpm exec wrangler secret list --env production --format json | jq -r '.[].name' | sort | tee -a "$GITHUB_STEP_SUMMARY"

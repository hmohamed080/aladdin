# Aladdin — minimum PR validation CI.
#
# Runs on pull requests into the protected `main` and on pushes to `main`.
# Uses ONLY official GitHub actions (checkout / setup-node / setup-python),
# with corepack (bundled with Node) for pnpm and pipx (preinstalled on runners)
# for the uv tool — so there are no third-party actions to vet.
#
# Stable status-check job names for branch protection: `frontend`, `backend`, `docs`,
# and `migration-policy` (PRs only; add it to the ruleset's required checks once merged).
# No runtime `apt-get` (see docs/operations/CI_DEPENDENCY_PINNING.md): the Ubuntu mirror (azure.archive.ubuntu.com) failed DNS
# resolution on hosted runners and failed the frontend and backup-kit jobs across reruns. Runner: ubuntu-24.04 (pinned, not
# `latest`). Browser: the official Playwright image pinned by digest. ffmpeg: a static build image pinned by digest.
# age: built from the pinned module version, verified by the Go checksum database.
# Hardening follow-ups (documented in docs/technical/TECHNICAL_DEBT.md):
#   - pin actions to full commit SHAs;
#   - add Docker image build + Supabase RLS/isolation jobs once reliable in CI.

name: CI

on:
  pull_request:
    # Stacked release PRs (base = an integration branch) run the same checks, including migration-policy.
    branches: [main, "integration/**"]
  push:
    branches: [main]
  # Manual runs on stacked release branches (their PRs do not target main yet).
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only, no secrets used.
permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    # Official Playwright image, pinned by digest: it carries the exact Chromium build and the system libraries for Playwright 1.62.1
    # (the version in pnpm-lock.yaml; the "Playwright matches the image" step fails the job if they ever diverge). No apt, no browser download.
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e # v1.62.1-noble
    # Real Redis for the cache-isolation, rate-limit and job-lock tests (ADR-0019).
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://redis:6379 # the service container is reached by its hostname from inside the job container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend test
      # Real-Chromium regression test (local servers, no secret): Cloudflare Access credentials never follow a redirect.
      - name: Playwright matches the pinned image (exact version, bundled Chromium present)
        run: |
          v="$(pnpm --filter frontend exec playwright --version)"
          echo "$v; browsers: $PLAYWRIGHT_BROWSERS_PATH"; ls "$PLAYWRIGHT_BROWSERS_PATH"
          test "$v" = "Version 1.62.1" || { echo "::error::Playwright is $v but the pinned image is v1.62.1; update the image digest together with the lockfile"; exit 1; }
          ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null
      - run: pnpm --filter frontend e2e:access-routing
      - run: pnpm --filter frontend build
      # Media Worker (edge/media-worker): unit tests with fake R2/database bindings, no Cloudflare account.
      - run: pnpm --filter @aladdin/media-worker typecheck
      - run: pnpm --filter @aladdin/media-worker test
      # Backend Worker (edge/backend-worker, ADR-0022): container env allowlist and routing rules.
      - run: pnpm --filter @aladdin/backend-worker test

  # The same app built for Cloudflare Workers (OpenNext, ADR-0021). Builds and bundles only:
  # no Cloudflare account, no deploy. Catches anything that breaks the Workers runtime build.
  frontend-cloudflare:
    name: frontend-cloudflare
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4 requires Node 22
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend cf:build
      - name: Bundle the Worker (dry run, no upload) and keep it under the 64 MiB limit
        working-directory: frontend
        run: pnpm exec wrangler deploy --env preview --dry-run --outdir "$RUNNER_TEMP/worker"
      # next.config.ts swaps server/storage/image-processing/runtime.ts for runtime.workers.ts
      # (Cloudflare Images binding) when ALADDIN_BUILD_TARGET=workers, set by open-next.config.ts.
      - name: The Worker bundle must not contain sharp, and must use the Images engine
        working-directory: frontend
        run: |
          # Bundled code only (worker.js and OpenNext's handler); copied package sources may mention sharp in messages.
          if grep -lE "sharp-linux|@img/sharp|node_modules/sharp/" "$RUNNER_TEMP/worker/worker.js" .open-next/server-functions/default/frontend/handler.mjs; then
            echo "sharp leaked into the Worker bundle"; exit 1
          fi
          if ! grep -q 'cloudflare-images' "$RUNNER_TEMP/worker/worker.js"; then
            echo "the Worker bundle does not carry the Cloudflare Images engine (image-processing/runtime.workers.ts)"; exit 1
          fi

  backend:
    name: backend
    runs-on: ubuntu-24.04
    # Real Redis for the cache-isolation, rate-limit and job-lock tests (ADR-0019).
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv (tool bootstrap; project deps stay uv-managed)
        run: pipx install uv
      # ffmpeg and ffprobe for the real transcode test of the video worker (ADR-0020): static 7.1.1 build image pinned by digest
      # (mwader/static-ffmpeg:7.1.1), copied out of the image; no apt.
      - name: Install ffmpeg and ffprobe (digest-pinned static build)
        run: |
          set -euo pipefail
          cid="$(docker create mwader/static-ffmpeg@sha256:11a44711684c0b9f754c047dcd64235b8b52deab251bd0e0a86f22faa160749c x)"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          docker cp "$cid:/ffmpeg" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          docker cp "$cid:/ffprobe" "$RUNNER_TEMP/ffmpeg-bin/ffprobe"
          docker rm "$cid" >/dev/null
          chmod +x "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-bin/ffprobe"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      # test_video_transcode.py skips its real transcodes when ffmpeg/ffprobe are missing: fail here instead of skipping silently.
      - name: ffmpeg provides the binaries and encoders the worker and tests use
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          ffprobe -version | head -1
          enc="$(ffmpeg -hide_banner -encoders)"
          for e in libx264 libvpx-vp9 libopus aac; do
            printf '%s\n' "$enc" | grep -qE " $e " || { echo "::error::ffmpeg lacks the $e encoder"; exit 1; }
          done
      - run: uv sync --frozen --python 3.12 --group video-worker
      - run: uv run ruff check .
      - run: uv run --group video-worker pytest

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal markdown link check
        run: python scripts/check_doc_links.py
      - name: No tracked dependency/build/secret files
        run: |
          if git ls-files \
            | grep -E '(^|/)(node_modules|\.next|out|dist|build|coverage|\.turbo|\.cache|\.venv|__pycache__|\.pytest_cache|\.ruff_cache|\.mypy_cache)/|(^|/)\.env($|\.)' \
            | grep -v '\.env\.example'; then
            echo "::error::tracked dependency/build/secret file(s) found"; exit 1
          fi
          echo "no tracked dependency/build/secret files"
      - name: No .pen file tracked
        run: |
          if git ls-files | grep -E '\.pen$'; then
            echo "::error::a .pen file is tracked (must be gitignored)"; exit 1
          fi
          echo "no .pen files tracked"
      - name: No merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::merge-conflict markers found"; exit 1
          fi
          echo "no conflict markers"

  # The backup kit that the private aladdin-backups repo runs (ops/backups/). Workflows are linted with the
  # pinned actionlint (Go module, built by the official setup-go action; shellcheck is preinstalled on the
  # runner), and the run-planning and target checks are tested offline. Touches no hosted resource.
  backup-kit:
    name: backup-kit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: actionlint (backup workflows)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color ops/backups/workflows/*.yml
      - name: shellcheck (backup scripts)
        run: shellcheck -S warning ops/backups/*.sh
      - name: Schedule, Production gate and target checks (offline)
        run: bash ops/backups/plan-test.sh
      - name: Retention contract (rules, constants, buckets, 59-day window)
        run: bash ops/backups/retention-test.sh
      - name: Wrong-target guards stop before any tool runs (shimmed, offline)
        run: bash ops/backups/target-guard-test.sh
      - name: Admin backup environment binding tool (shimmed, offline)
        run: bash ops/backups/admin-initialize-test.sh
      - name: Credential isolation (service-role key never next to the age restore identity)
        run: python3 ops/backups/workflow-isolation-test.py
      - name: Runtime schedule (pauses, overrides, slot dates)
        run: python3 ops/backups/runtime-schedule-test.py
      - name: Run ledger bridge (claims, completion, cancellation, refusals)
        run: python3 ops/backups/report-run-test.py
      - name: Restore stack pin and strict Auth/Storage guard
        run: bash ops/backups/restore-pin-test.sh
      - name: The built backup repo holds the whole kit
        run: bash ops/backups/build-repo-test.sh
      - name: Media record validator (fail-closed rules)
        run: python3 ops/backups/media-record-test.py
      # age and age-keygen: built from the pinned module version v1.1.1 (the version Ubuntu 24.04 packages); go install verifies the
      # module against the Go checksum database (sum.golang.org). No apt.
      - name: Install age (pinned module version, checksum-database verified)
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/age-bin" go install filippo.io/age/cmd/age@v1.1.1 filippo.io/age/cmd/age-keygen@v1.1.1
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age-bin/age" --version
          "$RUNNER_TEMP/age-bin/age-keygen" --version
      # The tests that need an S3 API run against moto (an in-process S3 stand-in). moto rejects the region "auto"
      # that R2 uses, so a small `aws` wrapper pins a real region for the stand-in only.
      - name: S3 stand-in (moto) for the freshness and restore-window tests
        run: |
          python3 -m venv "$RUNNER_TEMP/s3" && "$RUNNER_TEMP/s3/bin/pip" install -q "moto[server]==5.2.5" "awscli==1.46.2"
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/usr/bin/env bash\nexport AWS_DEFAULT_REGION=us-east-1\nexec "%s/s3/bin/aws" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/shim/aws"
          chmod +x "$RUNNER_TEMP/shim/aws"
          "$RUNNER_TEMP/s3/bin/moto_server" -p 8333 >"$RUNNER_TEMP/moto.log" 2>&1 &
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: Site-media backup and verifier (fake S3, offline)
        run: bash ops/backups/site-media-backup-test.sh
      - name: Media coverage fails closed (Supabase Storage, R2, mixed, partial, empty; switches off)
        env: { AWS_ACCESS_KEY_ID: testkey, AWS_SECRET_ACCESS_KEY: testsecret }
        run: bash ops/backups/media-coverage-test.sh
      - name: Freshness alarm fails closed
        env: { AWS_ACCESS_KEY_ID: testkey, AWS_SECRET_ACCESS_KEY: testsecret }
        run: bash ops/backups/freshness-test.sh
      - name: Retired R2 originals - one rule for the live, restored and dump readers (real PostgreSQL)
        env: { REQUIRE_PG: "1" }
        run: bash ops/backups/r2-eligibility-test.sh
      - name: Retired R2 originals - backup, replacement race and restore verification (S3 stand-in + PostgreSQL)
        env: { AWS_ACCESS_KEY_ID: testkey, AWS_SECRET_ACCESS_KEY: testsecret, REQUIRE_PG: "1" }
        run: bash ops/backups/r2-retired-media-test.sh
      - name: Request photos and verification documents are always required in a media backup
        run: python3 ops/backups/r2-new-namespaces-test.py
      - name: R2 read failures are classified, retried only if transient, and never leak names
        env: { AWS_ACCESS_KEY_ID: testkey, AWS_SECRET_ACCESS_KEY: testsecret }
        run: bash ops/backups/r2-read-diagnostics-test.sh
      - name: Restore verification inside and outside the guaranteed window
        env: { AWS_ACCESS_KEY_ID: testkey, AWS_SECRET_ACCESS_KEY: testsecret }
        run: bash ops/backups/media-window-test.sh

  # Pull requests only. A review aid for `supabase/migrations`: see scripts/migration-policy.mjs and the
  # expand/contract rules in docs/operations/staging-deployment-runbook.md. It also runs the unit tests of the
  # migration-history guard and the other repository scripts.
  migration-policy:
    name: migration-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The media-storage script tests load sharp from the frontend workspace.
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (migration-history guard, migration policy, media storage)
        run: node --test scripts/*.test.mjs
      - name: Review the migrations changed by this PR
        run: |
          git diff --name-status --no-renames "$BASE_SHA"...HEAD -- supabase/migrations > "$RUNNER_TEMP/migration-changes.txt"
          git ls-tree -r --name-only "$BASE_SHA" -- supabase/migrations > "$RUNNER_TEMP/migration-base-files.txt"
          node scripts/migration-policy.mjs \
            --changes "$RUNNER_TEMP/migration-changes.txt" \
            --base-files "$RUNNER_TEMP/migration-base-files.txt"

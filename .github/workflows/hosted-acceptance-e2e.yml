# Aladdin - hosted, READ-ONLY E2E against the Cloudflare Acceptance preview.
#
# Target: https://aladdin-frontend-preview.bstalent9.workers.dev only (acceptance Supabase nxossqhdfltcqdwvbewi). It signs in
# as the three Acceptance test accounts (owner test1@example.com, acc6-sales-manager, acc6-sales-rep), opens pages and
# reads what renders. It creates, edits and deletes nothing, deploys nothing, and never touches Production, DNS or
# the database directly. See frontend/playwright.acceptance.config.ts and frontend/e2e-acceptance/.
#
# GitHub Environment `acceptance-e2e` (separate from `cloudflare-preview`, so this job never sees a deploy token):
#   secrets: ACCEPTANCE_E2E_OWNER_PASSWORD, ACCEPTANCE_E2E_MANAGER_PASSWORD, ACCEPTANCE_E2E_REP_PASSWORD,
#            CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET (a DEDICATED Cloudflare Access service token for this job only,
#            with a Service Auth policy on the preview application; the preview is behind Access and answers 302 without it)
# Without all three the run stops at the first step and tests nothing.
#
# Runs on pushes to its branch: GitHub only offers the manual button for workflows on the default branch.

name: Hosted acceptance E2E

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ytjg02]
    paths: ["frontend/e2e-acceptance/**", "frontend/playwright.acceptance.config.ts", ".github/workflows/hosted-acceptance-e2e.yml"]

concurrency:
  group: hosted-acceptance-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance-e2e:
    name: hosted-acceptance-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: acceptance-e2e
    env:
      ACCEPTANCE_BASE_URL: https://aladdin-frontend-preview.bstalent9.workers.dev
      ACCEPTANCE_E2E_OWNER_PASSWORD: ${{ secrets.ACCEPTANCE_E2E_OWNER_PASSWORD }}
      ACCEPTANCE_E2E_MANAGER_PASSWORD: ${{ secrets.ACCEPTANCE_E2E_MANAGER_PASSWORD }}
      ACCEPTANCE_E2E_REP_PASSWORD: ${{ secrets.ACCEPTANCE_E2E_REP_PASSWORD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Require the three test-account secrets
        run: |
          for name in ACCEPTANCE_E2E_OWNER_PASSWORD ACCEPTANCE_E2E_MANAGER_PASSWORD ACCEPTANCE_E2E_REP_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::$name is missing from the acceptance-e2e Environment"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile --filter frontend
          pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Confirm the preview serves Acceptance
        run: |
          access=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            access=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          # Never follow redirects and never print headers: Access answers 302 to its login page without a valid token.
          code=$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' --max-time 30 "${access[@]}" "$ACCEPTANCE_BASE_URL/api/backend/health")
          if [ "$code" = "302" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::HTTP $code from Cloudflare Access: the preview is protected and the CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET service token is missing, expired or not allowed by the Access policy"
            exit 1
          fi
          [ "$code" = "200" ] || { echo "::error::the preview backend health answered HTTP $code"; exit 1; }
          cat "$RUNNER_TEMP/health.json"; echo
          grep -q '"env":"staging"' "$RUNNER_TEMP/health.json" || { echo "::error::the preview backend is not the acceptance service"; exit 1; }
      - name: Hosted read-only E2E
        run: |
          set -o pipefail
          mkdir -p .artifacts/acceptance-e2e
          pnpm --filter frontend exec playwright test -c playwright.acceptance.config.ts 2>&1 | tee .artifacts/acceptance-e2e/run.log
      - name: Preserve the text report (no traces, videos or screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-acceptance-e2e-${{ github.sha }}
          path: .artifacts/acceptance-e2e/
          retention-days: 14
          if-no-files-found: warn

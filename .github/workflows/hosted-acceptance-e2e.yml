# Aladdin - hosted, READ-ONLY E2E against the Cloudflare Acceptance preview.
#
# Target: https://aladdin-frontend-preview.bstalent9.workers.dev only (acceptance Supabase nxossqhdfltcqdwvbewi). It signs in
# as the three Acceptance test accounts (owner test1@example.com, acc6-sales-manager, acc6-sales-rep), opens pages and
# reads what renders. It creates, edits and deletes nothing, deploys nothing, and never touches Production, DNS or
# the database directly. See frontend/playwright.acceptance.config.ts and frontend/e2e-acceptance/.
#
# GitHub Environment `acceptance-e2e` (separate from `cloudflare-preview`, so this job never sees a deploy token):
#   secrets: ACCEPTANCE_E2E_OWNER_PASSWORD, ACCEPTANCE_E2E_MANAGER_PASSWORD, ACCEPTANCE_E2E_REP_PASSWORD,
#            ACCEPTANCE_E2E_ACCESS_CLIENT_ID, ACCEPTANCE_E2E_ACCESS_CLIENT_SECRET (a DEDICATED Cloudflare Access service token,
#            authorised only for the aladdin-frontend-preview application; the preview is behind Access)
# Scope `full` needs all five; scope `smoke` (workflow_dispatch default) needs only the two Access credentials. Missing ones stop the run at the first step.
#
# Runs on pushes to its branch: GitHub only offers the manual button for workflows on the default branch.

name: Hosted acceptance E2E

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke = public smoke only (Access token only, no account passwords; the default, because `full` cannot pass while real CAPTCHA is on). full = also the persona sign-in tests."
        type: choice
        options: [smoke, full]
        default: smoke
  push:
    branches: [claude/project-thread-ytjg02]
    paths: ["frontend/e2e-acceptance/**", "frontend/playwright.acceptance.config.ts", ".github/workflows/hosted-acceptance-e2e.yml"]

concurrency:
  group: hosted-acceptance-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance-e2e:
    name: hosted-acceptance-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: acceptance-e2e
    env:
      ACCEPTANCE_BASE_URL: https://aladdin-frontend-preview.bstalent9.workers.dev
      # Push runs have no inputs: they stay `full`, as before. Only a manual dispatch can choose `smoke` (its default).
      SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'full' }}
      ACCEPTANCE_E2E_OWNER_PASSWORD: ${{ (github.event_name != 'workflow_dispatch' || inputs.scope == 'full') && secrets.ACCEPTANCE_E2E_OWNER_PASSWORD || '' }}
      ACCEPTANCE_E2E_MANAGER_PASSWORD: ${{ (github.event_name != 'workflow_dispatch' || inputs.scope == 'full') && secrets.ACCEPTANCE_E2E_MANAGER_PASSWORD || '' }}
      ACCEPTANCE_E2E_REP_PASSWORD: ${{ (github.event_name != 'workflow_dispatch' || inputs.scope == 'full') && secrets.ACCEPTANCE_E2E_REP_PASSWORD || '' }}
      ACCEPTANCE_E2E_ACCESS_CLIENT_ID: ${{ secrets.ACCEPTANCE_E2E_ACCESS_CLIENT_ID }}
      ACCEPTANCE_E2E_ACCESS_CLIENT_SECRET: ${{ secrets.ACCEPTANCE_E2E_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Require the secrets this scope needs
        # smoke: only the two Access credentials (the persona passwords are not even exported to the job).
        # full: also the three test-account passwords.
        run: |
          names="ACCEPTANCE_E2E_ACCESS_CLIENT_ID ACCEPTANCE_E2E_ACCESS_CLIENT_SECRET"
          if [ "$SCOPE" = "full" ]; then
            names="ACCEPTANCE_E2E_OWNER_PASSWORD ACCEPTANCE_E2E_MANAGER_PASSWORD ACCEPTANCE_E2E_REP_PASSWORD $names"
          elif [ "$SCOPE" != "smoke" ]; then
            echo "::error::unknown scope '$SCOPE' (expected smoke or full)"; exit 1
          fi
          for name in $names; do
            [ -n "${!name}" ] || { echo "::error::$name is missing from the acceptance-e2e Environment"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile --filter frontend
          pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Credential-scoping regression (local servers, real Chromium, no network)
        # The token must never follow a redirect to another origin; if this fails, nothing below runs with the token.
        run: pnpm --filter frontend e2e:access-routing
      - name: Confirm the preview serves Acceptance (through Cloudflare Access)
        # Fails closed: both Access credentials required; an Access redirect (no auto-follow) or any non-200 JSON answer fails.
        # The token goes only to the exact preview origin hard-coded in e2e-acceptance/access.mjs.
        run: node frontend/e2e-acceptance/access.mjs
      - name: Hosted read-only E2E
        run: |
          set -o pipefail
          mkdir -p .artifacts/acceptance-e2e
          args=()
          if [ "$SCOPE" = "smoke" ]; then
            # Anchored on the describe title ("<project> <file> public smoke <test>"); pinned by e2e-acceptance/smoke-scope.test.ts.
            SMOKE_GREP='hosted-acceptance\.spec\.ts public smoke '
            listed="$(pnpm --filter frontend exec playwright test -c playwright.acceptance.config.ts --list --grep "$SMOKE_GREP")"
            echo "$listed"
            count="$(echo "$listed" | grep -c ' public smoke ' || true)"
            others="$(echo "$listed" | grep -E 'spec\.ts:' | grep -vc ' public smoke ' || true)"
            [ "$count" -ge 1 ] || { echo "::error::smoke selection matched zero tests"; exit 1; }
            [ "$others" -eq 0 ] || { echo "::error::smoke selection matched a non-smoke test"; exit 1; }
            args=(--grep "$SMOKE_GREP")
          fi
          pnpm --filter frontend exec playwright test -c playwright.acceptance.config.ts "${args[@]}" 2>&1 | tee .artifacts/acceptance-e2e/run.log
      - name: Preserve the text report (no traces, videos or screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-acceptance-e2e-${{ env.SCOPE }}-${{ github.sha }}
          path: .artifacts/acceptance-e2e/
          retention-days: 14
          if-no-files-found: warn

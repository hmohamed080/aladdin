# Daily backups. Lives in the separate private repo `aladdin-backups` (copied there by ops/backups/build-repo.sh).
# Read-only on the databases; writes only new, locked objects to the backup bucket.
# Which projects a run covers is decided by backup/plan.sh (tested offline by backup/plan-test.sh):
#   - Production only when the repository variable PRODUCTION_BACKUP_ENABLED is exactly "true" (the owner's
#     activation GO); a manual Production run also needs the typed confirmation "back up production".
#   - Acceptance by ACCEPTANCE_BACKUP_SCHEDULE: off (default), daily (the trial) or weekly (Sundays, Cairo).
name: Daily backup
on:
  schedule:
    # 01:30 Cairo all year (23:30 UTC in winter UTC+2, 22:30 UTC in summer UTC+3), then retries at 02:30 and 03:30
    # Cairo. plan.sh keeps the three firings whose Cairo hour is 01-03; a retry does nothing when the night's
    # snapshot is complete and takes a new snapshot when the media backup failed or was interrupted.
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      label:
        description: "Which project to back up"
        type: choice
        options: [acceptance, production]
        default: acceptance
      confirm:
        description: 'Production only: type "back up production"'
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: daily-backup
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.plan.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_LABEL: ${{ inputs.label }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          PRODUCTION_BACKUP_ENABLED: ${{ vars.PRODUCTION_BACKUP_ENABLED }}
          ACCEPTANCE_BACKUP_SCHEDULE: ${{ vars.ACCEPTANCE_BACKUP_SCHEDULE }}
        run: |
          labels="$(bash backup/plan.sh backup)"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "Projects in this run: $labels" >> "$GITHUB_STEP_SUMMARY"

  backup:
    needs: plan
    if: needs.plan.outputs.labels != '[]'
    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.labels) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: backup-${{ matrix.label }}
    env:
      BACKUP_LABEL: ${{ matrix.label }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_WRITE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_WRITE_SECRET }}
      AGE_RECIPIENTS: ${{ vars.AGE_RECIPIENTS }}
      BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_BACKUP_ENABLED: ${{ vars.PRODUCTION_BACKUP_ENABLED }}
      SKIP_IF_TAKEN: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Hand-off folder between the two backup steps
        run: echo "BACKUP_STATE_DIR=$RUNNER_TEMP/backup-state" >> "$GITHUB_ENV"
      - name: Install age and the Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client-17 >/dev/null
      - name: Database backup
        run: bash backup/db-backup.sh
      - name: Media backup (this snapshot's files in Supabase Storage)
        run: bash backup/media-backup.sh

# Monthly restore test into a throwaway local Supabase stack on the runner. Touches no hosted project.
# The restore-test private key lives only in the `restore-test` environment, never next to the write token.
name: Monthly restore test
on:
  schedule:
    - cron: "0 4 2 * *"        # 06:00 Cairo on the 2nd
  workflow_dispatch:
    inputs:
      label:
        type: choice
        options: [production, acceptance]
        default: production
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: restore-test
    env:
      BACKUP_LABEL: ${{ github.event.inputs.label || 'production' }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET }}
      AGE_IDENTITY: ${{ secrets.AGE_RESTORE_TEST_IDENTITY }}
      REPO_ROOT: ${{ github.workspace }}
      OUT: ${{ runner.temp }}/restore-test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
      - name: Restore and verify
        run: |
          umask 077; printf '%s\n' "$AGE_IDENTITY" > "$RUNNER_TEMP/restore.key"
          AGE_IDENTITY_FILE="$RUNNER_TEMP/restore.key" bash backup/restore-test.sh
      - name: Report (counts and hashes only)
        if: always()
        run: cat "$OUT/REPORT.txt" >> "$GITHUB_STEP_SUMMARY" || true

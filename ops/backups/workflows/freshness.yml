# Daily alarm: fails, and emails the owner, when a backup is missing, late or suspiciously small.
name: Backup freshness
on:
  schedule:
    - cron: "0 5 * * *"        # 07:00 Cairo, after the 01:30 backup
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: backup-check
    env:
      BACKUP_LABEL: production
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET }}
      CHECK_MEDIA: "1"
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - run: bash backup/freshness.sh

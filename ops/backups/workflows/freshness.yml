# Daily alarm: fails, and emails the owner, when a backup is missing, late, suspiciously small, or its media
# step did not finish complete. What it watches comes from the Admin console, like the backups themselves: a
# SCHEDULED check skips a project whose schedule is off, paused or (Production) not activated, and allows 26 h
# for a daily schedule and 194 h for a weekly one. A MANUAL run also checks while off or paused. If the console
# cannot be read, the project is still checked with the 26 h limit and the run stays red.
name: Backup freshness
on:
  schedule:
    - cron: "0 5 * * *"        # 07:00 Cairo in winter, 08:00 in summer: always hours after the 01:30 backup
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Alarm drill only: a LOWER age limit in hours (for example 1) so a healthy backup trips the alarm and the alert path is exercised. Leave empty for a normal check."
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  # The service-role key lives only in this job (environment `backup-control-<label>`): it reads the console
  # schedule and hands on one number. It touches no bucket.
  control:
    name: control (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        label: [acceptance, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: backup-control-${{ matrix.label }}
    outputs:
      max_age_acceptance: ${{ matrix.label == 'acceptance' && steps.control.outputs.max_age_hours || '' }}
      max_age_production: ${{ matrix.label == 'production' && steps.control.outputs.max_age_hours || '' }}
    env:
      EVENT: ${{ github.event_name }}
      BACKUP_KIND: freshness
      BACKUP_LABEL: ${{ matrix.label }}
      INPUT_MAX_AGE_HOURS: ${{ inputs.max_age_hours }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the console schedule
        id: control
        run: python3 backup/runtime-schedule.py

  gate:
    name: gate
    needs: control
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.gate.outputs.targets }}
    env:
      MAX_AGE_ACCEPTANCE: ${{ needs.control.outputs.max_age_acceptance }}
      MAX_AGE_PRODUCTION: ${{ needs.control.outputs.max_age_production }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: python3 backup/runtime-schedule.py targets | tee -a "$GITHUB_STEP_SUMMARY"

  check:
    needs: gate
    if: always() && !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.gate.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: backup-check-${{ matrix.target.label }}
    env:
      BACKUP_LABEL: ${{ matrix.target.label }}
      MAX_AGE_HOURS: ${{ matrix.target.max_age_hours }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET }}
      LEGACY_MEDIA_BACKUP: ${{ vars.LEGACY_MEDIA_BACKUP }}
      R2_MEDIA_BACKUP: ${{ vars.R2_MEDIA_BACKUP }}
      R2_SITE_BACKUP: ${{ vars.R2_SITE_BACKUP }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - run: bash backup/freshness.sh
